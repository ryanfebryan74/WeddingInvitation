<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Great+Vibes&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ivory:#F5E7DD;--paper:#FCF4EE;--wine:#7B2230;--wine9:#4A1220;--rose:#EBC9C0;--gold:#C2A25F;--text:#4E3235;--muted:#8F7471;--border:#E0C9B8;--ok:#4F7A5A;--warn:#C08A2E;--bad:#9B3B3B;--s1:#9FB3A8;--s2:#EDB9A8;--s3:#EBD29B;--s4:#B5424A;--bt1:none;--tile:none}
html[data-theme=sage]{--ivory:#EEF1E6;--paper:#F9FAF3;--wine:#4B6B55;--wine9:#27392D;--rose:#D5E0CC;--gold:#B8A06A;--text:#2F3D33;--muted:#6F7E72;--border:#CDD6C3;--s1:#A9BFA9;--s2:#F0C9BD;--s3:#EAD8A5;--s4:#C46B6B}
html[data-theme=navy]{--ivory:#E9EEF3;--paper:#F6F8FB;--wine:#2C4468;--wine9:#16263F;--rose:#CBD6E5;--gold:#BBA56F;--text:#263247;--muted:#6B7890;--border:#C9D2DE;--s1:#A8BACB;--s2:#EFC9C0;--s3:#EAD8A5;--s4:#C4707A}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Jost',system-ui,sans-serif;background:var(--ivory);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden;--pvh:0px}
body.pv{--pvh:34px}
body.lock{overflow:hidden}

/* ===== LAYAR PENUH (anti tema Blogger) =====
   Undangan dipasang sebagai lapisan fixed 100% layar langsung di <body>,
   sehingga header/sidebar/padding/transform tema Blogger tidak berpengaruh. */
html.inv,html.inv body{margin:0!important;padding:0!important;height:100%!important;overflow:hidden!important;background:var(--ivory)!important}
#root{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;height:100dvh;z-index:2147483000;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--ivory);color:var(--text);font:400 16px/normal 'Jost',system-ui,sans-serif;letter-spacing:normal;text-align:left;text-transform:none;-webkit-text-size-adjust:100%}
body.lock #root{overflow:hidden}
#boot{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:28px;text-align:center;background:radial-gradient(circle at 28% 18%,#5A2C38,#3B1F28 58%,#25131A);color:#F6E9DE;font-family:'Cormorant Garamond',Georgia,serif}
#boot h2{font:500 24px/1.3 'Cormorant Garamond',Georgia,serif;letter-spacing:.06em;text-transform:uppercase}
#boot p{font:400 13.5px/1.7 'Jost',system-ui,sans-serif;max-width:340px;color:#E3BFB5;word-break:break-word}
#boot code{display:block;margin-top:8px;font:400 11px/1.5 monospace;color:#F6E9DE;opacity:.8}
#boot button{margin-top:6px;padding:12px 26px;border-radius:999px;border:1px solid #B8935A;background:#F6E9DE;color:#3E0E18;font:500 12px 'Jost',sans-serif;letter-spacing:.2em;text-transform:uppercase;cursor:pointer}
.bootsp{width:38px;height:38px;border-radius:50%;border:2px solid rgba(184,147,90,.3);border-top-color:#B8935A;animation:spin 1s linear infinite}
.hide{display:none!important}
button{font-family:inherit}
.ic{flex:none;vertical-align:middle}

/* ===== UNDANGAN V2.0 - HERITAGE LUXE ===== */
#pub{max-width:430px;margin:0 auto;background:var(--paper);min-height:100%;position:relative;box-shadow:0 0 90px rgba(46,11,20,.3);padding-top:var(--pvh);overflow:hidden;isolation:isolate;--sy:0;--p:0}
@media(min-width:768px){body:not(.adminmode) #root{background:radial-gradient(circle at 14% 18%,var(--rose) 0,transparent 42%),radial-gradient(circle at 92% 86%,var(--wine) 0,transparent 55%),var(--ivory)}}
.lbl{font:400 11px/1.8 'Jost',sans-serif;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
.h2{font:500 30px/1.2 'Cinzel','Cormorant Garamond',serif;color:var(--wine);letter-spacing:.08em;text-transform:uppercase;margin:4px 0 6px}
.h3{font:600 22px/1.25 'Cinzel','Cormorant Garamond',serif;color:var(--wine);letter-spacing:.07em;text-transform:uppercase}
.sm{font:400 13.5px/1.8 'Jost',sans-serif;color:var(--text);margin:8px 0}
.just{text-align:justify;hyphens:auto}
.rule{width:96px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:16px auto;position:relative}
.rule:after{content:'\25C6';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:7px;color:var(--gold);background:var(--paper);padding:0 7px}
.red .rule:after{background:var(--wine)}
.red .arch .h2,.red .arch .h3,.red .card2 .h2,.red .card2 .h3{color:var(--wine)}
.red .arch .lbl,.red .card2 .lbl{color:var(--muted)}
.red .arch .sm,.red .card2 .sm{color:var(--text)}
.red .arch .rule:after,.red .card2 .rule:after{background:var(--paper)}
.script{font-family:'Great Vibes',cursive;font-weight:400;text-transform:none;letter-spacing:0}
.bigd{font:500 54px/1 'Cormorant Garamond',serif;color:var(--wine);margin:2px 0}
.dt{font:italic 500 19px/1.4 'Cormorant Garamond',serif;color:var(--wine)}
.quote{font:italic 500 18px/1.65 'Cormorant Garamond',serif;color:var(--text)}
.emp{padding:34px 20px;border:1px dashed var(--border);border-radius:20px;color:var(--muted);font-size:13px;line-height:1.7;text-align:center}
.adm-ic{background:none;border:0;color:inherit;opacity:.45;cursor:pointer;margin-left:6px;vertical-align:middle}
.cpr{font:400 11px/1.6 'Jost',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}

/* animasi muncul */
.rv{opacity:0;transform:translateY(24px);transition:opacity .9s ease var(--rd,0ms),transform .9s cubic-bezier(.2,.7,.2,1) var(--rd,0ms)}
.rv.in{opacity:1;transform:none}
.split .w{display:inline-block;opacity:0;transform:translateY(.55em);transition:opacity .7s ease calc(var(--i,0)*55ms),transform .7s cubic-bezier(.2,.7,.2,1) calc(var(--i,0)*55ms)}
.split.in .w{opacity:1;transform:none}

/* latar tetap: ilustrasi samar + kelopak */
.bgfx{position:fixed;top:0;bottom:0;left:50%;width:min(430px,100%);transform:translateX(-50%);z-index:0;pointer-events:none;overflow:hidden}
.bgfx .wm{position:absolute;inset:0;opacity:.2}
.bgfx .wm svg{width:100%;height:100%;display:block}
.bg-pts i{position:absolute;top:-30px;width:var(--s,8px);height:calc(var(--s,8px)*1.3);background:var(--s2);border-radius:100% 0 100% 0;opacity:.7;animation:fall var(--d,16s) linear var(--dl,0s) infinite;left:var(--l)}
.bg-pts i.g{background:var(--gold);border-radius:50%;height:var(--s,3px);opacity:.8}
@keyframes fall{0%{transform:translate3d(0,-30px,0) rotate(0)}100%{transform:translate3d(var(--dx,30px),110vh,0) rotate(var(--r,200deg))}}
.prog{position:fixed;top:var(--pvh);left:50%;width:min(430px,100%);height:3px;z-index:75;background:linear-gradient(90deg,var(--gold),var(--wine));transform:translateX(-50%) scaleX(var(--p,0));transform-origin:0 50%}

/* sections */
.sec{position:relative;z-index:1;padding:72px 24px;text-align:center;overflow:hidden}
.cream{background:rgba(252,244,238,.84)}
.red{background-color:var(--wine);background-image:var(--bt1);color:#F6E7D6}
.red .lbl{color:#E7C9BE}.red .h2,.red .h3{color:#F8E9D6}.red .sm{color:#F1DCCB}
.cn{position:absolute;width:64px;height:64px;background:var(--tile);background-size:64px;z-index:2;pointer-events:none}
.cn.tl{top:0;left:0}.cn.tr{top:0;right:0;transform:scaleX(-1)}.cn.bl{bottom:0;left:0;transform:scaleY(-1)}.cn.br{bottom:0;right:0;transform:scale(-1)}
.flo{position:absolute;pointer-events:none;z-index:1}

/* tombol */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 28px;border-radius:999px;background:var(--wine);color:#FBEFE2;border:1px solid var(--gold);font:500 11.5px 'Jost',sans-serif;letter-spacing:.22em;text-transform:uppercase;cursor:pointer;box-shadow:0 8px 22px rgba(74,18,32,.28);transition:transform .25s,box-shadow .25s;text-decoration:none}
.btn:hover{transform:translateY(-2px)}
.btn.gold{background:linear-gradient(135deg,#D8BC7C,#B8935A 55%,#D3B676);color:#3A1A10;border-color:#E9D7A5;box-shadow:0 8px 20px rgba(120,86,30,.35)}
.btn-o{background:transparent;color:var(--wine);border:1px solid var(--wine);box-shadow:none}
.btn:disabled{opacity:.55;cursor:wait;transform:none}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.btns .btn{padding:11px 18px;font-size:10.5px;letter-spacing:.14em}

/* bingkai lengkung */
.arch{position:relative;border:2px solid var(--wine);border-radius:200px 200px 30px 30px;background:rgba(252,244,238,.95);box-shadow:0 0 0 5px var(--paper),0 0 0 6.5px var(--gold),0 18px 40px rgba(46,11,20,.28);padding:70px 24px 38px;margin:34px auto;max-width:340px;color:var(--text)}
.arch:before{content:'';position:absolute;inset:7px;border:1px solid var(--gold);border-radius:196px 196px 24px 24px;opacity:.55;pointer-events:none}
.card2{position:relative;border:2px solid var(--wine);border-radius:26px;background:rgba(252,244,238,.95);box-shadow:0 0 0 4px var(--paper),0 0 0 5.5px var(--gold),0 14px 34px rgba(46,11,20,.22);padding:28px 22px;margin:26px auto;max-width:360px;color:var(--text)}

/* cover: gunungan terbelah */
.cover{position:fixed;inset:0;z-index:80;color:var(--wine9);text-align:center;overflow:hidden;background:transparent;padding-top:var(--pvh)}
.cover .cvbg{position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,#FFF8F2,var(--ivory) 70%);transition:opacity .9s ease .9s}
.cover .cvfl{position:absolute;inset:0;transition:opacity .8s ease .5s,transform 1.4s ease}
.cover .cvfl svg{width:100%;height:100%;display:block}
.cover.open .cvfl{opacity:0;transform:scale(1.15)}
.cover.open .cvbg{opacity:0}
.cover .gun{position:absolute;left:50%;top:calc(11% + var(--pvh));height:min(38vh,330px);aspect-ratio:200/320;transform:translateX(-50%);transition:transform 1.5s cubic-bezier(.7,0,.2,1),opacity 1s ease .7s;filter:drop-shadow(0 12px 18px rgba(74,18,32,.35))}
.cover .gun svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.cover .gun .gnl,.cover .gun .gnr{position:absolute;inset:0}.cover .gun .gnl{clip-path:inset(0 50% 0 0)}.cover .gun .gnr{clip-path:inset(0 0 0 50%)}
.cover.open .gun .gnl{transform:translateX(-120vw)}.cover.open .gun .gnr{transform:translateX(120vw)}
.cover .gun .gnl,.cover .gun .gnr{transition:transform 1.6s cubic-bezier(.7,0,.2,1)}
.cover.open .gun{opacity:0}
.cover.gone{display:none}
.cv-top{position:absolute;top:calc(5vh + var(--pvh));left:0;right:0;z-index:3;transition:opacity .5s}
.cv-bot{position:absolute;bottom:5.5vh;left:0;right:0;z-index:3;padding:0 26px;max-width:430px;margin:0 auto;transition:opacity .5s}
.cover.open .cv-top,.cover.open .cv-bot{opacity:0}
.cv-bot .gn{font:600 26px/1.2 'Cinzel',serif;color:var(--wine9);margin:2px 0 8px;word-break:break-word;letter-spacing:.05em}
.cv-bot .sm{margin-bottom:16px;font-size:12.5px}

/* hero */
.hero{padding:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:var(--ivory)}
.hscene{position:absolute;inset:-4% 0;transform:translate3d(0,calc(var(--sy,0)*.16px),0) scale(1.06)}
.hscene svg{width:100%;height:100%;display:block}
.hcard{position:relative;z-index:4;width:min(78%,330px);min-height:min(60vh,520px);padding:60px 20px 38px;margin:0 auto;background:rgba(252,244,238,.68);display:flex;flex-direction:column;align-items:center;justify-content:center}
.mono{font:italic 600 58px/1 'Cormorant Garamond',serif;color:var(--wine);letter-spacing:-.06em}
.mono b{font-weight:600;margin-left:-.12em;opacity:.8}
.hnames{font:600 23px/1.35 'Cinzel',serif;color:var(--wine);letter-spacing:.06em;text-transform:uppercase;margin:6px 0}
.hnames i{display:block;font:italic 400 28px 'Great Vibes',cursive;text-transform:none;color:var(--gold);letter-spacing:0}
.mouse{margin-top:26px;width:20px;height:34px;border:1.5px solid var(--wine);border-radius:12px;position:relative}
.mouse:after{content:'';position:absolute;left:50%;top:6px;width:3px;height:7px;margin-left:-1.5px;border-radius:2px;background:var(--wine);animation:wheel 1.6s ease-in-out infinite}
@keyframes wheel{0%{opacity:0;transform:translateY(0)}30%{opacity:1}100%{opacity:0;transform:translateY(12px)}}
.bf{position:absolute;z-index:3;width:30px;pointer-events:none;animation:fly var(--d,18s) ease-in-out var(--dl,0s) infinite}
.bf svg{width:100%;display:block;overflow:visible}
.bf .wl{transform-origin:20px 20px;animation:flapl .35s ease-in-out infinite alternate}
.bf .wr{transform-origin:20px 20px;animation:flapr .35s ease-in-out infinite alternate}
@keyframes flapl{to{transform:scaleX(.3)}}@keyframes flapr{to{transform:scaleX(.3)}}
@keyframes fly{0%{transform:translate(0,0) rotate(-8deg)}25%{transform:translate(70px,-50px) rotate(10deg)}50%{transform:translate(20px,-110px) rotate(-6deg)}75%{transform:translate(-60px,-50px) rotate(12deg)}100%{transform:translate(0,0) rotate(-8deg)}}
.brd{position:absolute;z-index:3;width:46px;pointer-events:none;animation:glide var(--d,26s) linear var(--dl,0s) infinite}
@keyframes glide{0%{transform:translate(-60px,0)}50%{transform:translate(240px,-26px)}100%{transform:translate(520px,8px)}}

/* mempelai */
.banner{width:100%;aspect-ratio:16/9;border-radius:18px;overflow:hidden;margin:6px 0 18px;background:linear-gradient(135deg,var(--rose),var(--paper))}
.banner img{width:100%;height:100%;object-fit:cover;display:block}
.pc{margin:34px 0 8px}
.pf{width:170px;height:220px;margin:0 auto 14px;border-radius:85px 85px 16px 16px;overflow:hidden;border:2px solid var(--wine);padding:5px;background:var(--paper);box-shadow:0 0 0 4px var(--paper),0 0 0 5.5px var(--gold),0 12px 26px rgba(46,11,20,.25)}
.pf img,.pf span{width:100%;height:100%;border-radius:80px 80px 12px 12px;object-fit:cover;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--rose),var(--paper));font:500 70px 'Cormorant Garamond',serif;color:var(--wine)}
.pc .script{font-size:44px;line-height:1.1;color:var(--wine);margin-top:22px}
.pc .fn{font:600 14.5px/1.5 'Cinzel',serif;letter-spacing:.14em;text-transform:uppercase;color:var(--wine)}
.pc p{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.7}
.ig{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;margin-top:10px;border-radius:50%;background:var(--wine);color:#FBEFE2;text-decoration:none;box-shadow:0 6px 14px rgba(74,18,32,.3)}
.amp{font:italic 400 56px 'Great Vibes',cursive;color:var(--gold);line-height:1;margin:8px 0}

/* save the date */
.std{padding:90px 24px;color:#fff;background:linear-gradient(rgba(46,11,20,.55),rgba(46,11,20,.72)),var(--stdimg,linear-gradient(135deg,var(--wine),var(--wine9)));background-size:cover;background-position:center}
.std .h2{color:#fff;letter-spacing:.2em}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:26px 0 20px}
.cd div{padding:14px 4px;border-radius:16px;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.35);color:#fff}
.cd b{display:block;font:600 28px 'Cormorant Garamond',serif;font-variant-numeric:tabular-nums}
.cd small{font-size:9px;letter-spacing:.2em;text-transform:uppercase;opacity:.85}
.cd .done{grid-column:1/-1;background:transparent;border:1px dashed rgba(255,255,255,.5);font-size:13px;line-height:1.7;padding:16px}
.clock{display:inline-flex;align-items:center;gap:10px;padding:9px 22px;border-radius:999px;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.1);font:500 23px 'Cormorant Garamond',serif;letter-spacing:.12em;font-variant-numeric:tabular-nums;color:#fff}
.clock small{font:500 10px 'Jost';letter-spacing:.2em;opacity:.8}

/* acara */
.evc{text-align:center}
.evc .lbl{color:var(--muted)}
.evc .bigd{font-size:60px}
.evc .tm{font:500 13px 'Jost';letter-spacing:.14em;color:var(--wine);margin-top:6px}
.dv{display:flex;align-items:center;gap:12px;color:var(--wine);margin:16px 0 10px}
.dv span{flex:1;height:1px;background:var(--wine);opacity:.5}
.evc b{display:block;font:600 14px 'Cinzel',serif;letter-spacing:.1em;color:var(--wine9);text-transform:uppercase}
.qrd{margin-top:14px;font-size:12px;color:var(--muted)}
.qrd summary{cursor:pointer;list-style:none;letter-spacing:.14em;text-transform:uppercase;font-size:10.5px}
.qrd summary::-webkit-details-marker{display:none}
.qr{margin:12px auto 0;padding:10px;background:#fff;border-radius:14px;border:1px solid var(--border);width:max-content;min-width:140px;min-height:140px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted)}
.qr img,.qr canvas{display:block}
.dcode{display:flex;align-items:center;gap:12px;justify-content:center;text-align:left}
.dcode svg{color:var(--wine);flex:none}

/* cerita */
.story{margin-top:22px;text-align:left}
.story .ph{width:78%;max-width:260px;aspect-ratio:3/4;margin:0 auto 24px;border-radius:120px 120px 18px 18px;overflow:hidden;border:2px solid var(--wine);padding:5px;background:var(--paper);box-shadow:0 0 0 4px var(--paper),0 0 0 5.5px var(--gold)}
.story .ph img,.story .ph span{width:100%;height:100%;border-radius:114px 114px 13px 13px;object-fit:cover;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--rose),var(--paper))}
.story .ph span{color:var(--wine)}
.ti{position:relative;padding:0 0 22px 28px;border-left:1px solid var(--gold);margin-left:8px}
.ti:before{content:'';position:absolute;left:-6px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--wine);box-shadow:0 0 0 3px var(--paper),0 0 0 4px var(--gold)}
.ti b{display:block;font:600 14px 'Cinzel',serif;letter-spacing:.1em;color:var(--wine);text-transform:uppercase}
.ti i{font:italic 500 13px 'Cormorant Garamond',serif;color:var(--muted);display:block;margin:2px 0 6px;font-style:normal;letter-spacing:.18em}
.ti em{display:block;font-style:normal;font-size:13px;line-height:1.8;text-align:justify}

/* galeri */
.gal{columns:2;column-gap:10px;margin-top:22px}
.gf{break-inside:avoid;margin-bottom:10px;border-radius:16px;overflow:hidden;cursor:zoom-in;box-shadow:0 8px 20px rgba(46,11,20,.2);border:3px solid var(--paper);position:relative;background:var(--rose)}
.gf img{width:100%;display:block;transition:transform .6s}
.gf:hover img{transform:scale(1.05)}
.gf figcaption{position:absolute;left:0;right:0;bottom:0;padding:18px 10px 8px;color:#fff;font-size:11px;letter-spacing:.06em;background:linear-gradient(transparent,rgba(46,11,20,.7))}
.lb{position:fixed;inset:0;z-index:2147483100;background:rgba(20,5,8,.94);display:flex;align-items:center;justify-content:center;flex-direction:column;padding:20px}

function fileToDataURL(file, maxW = 1000) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = () => rej(new Error('Gagal membaca file'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error('File bukan gambar yang valid'));
      img.onload = () => {
        let w = img.width, h = img.height, q = .75, out = '';
        if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
        const c = document.createElement('canvas');
        for (let i = 0; i < 8; i++) {
          c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h);
          out = c.toDataURL('image/jpeg', q);
          if (out.length < 800000) return res(out);
          q -= .1; if (q < .4) { w = Math.round(w * .8); h = Math.round(h * .8); q = .7; }
        }
        rej(new Error('Foto terlalu besar, pakai foto lain atau tempel URL'));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

const Store = {
  handler: null, watching: new Set(),
  now() { return IS_PREVIEW ? Date.now() : fbm.fs.serverTimestamp(); },
  watch(name) {
    if (this.watching.has(name)) return; this.watching.add(name);
    if (IS_PREVIEW) { this.handler(name, cl(PV[name])); return; }
    const fs = fbm.fs;
    const err = e => { console.error(name, e); this.watching.delete(name); this.first && this.first(name); };
    if (name === 'settings') fs.onSnapshot(fs.doc(db, 'settings', 'wedding'), s => this.handler(name, s.exists() ? s.data() : {}), err);
    else fs.onSnapshot(fs.collection(db, name), s => this.handler(name, s.docs.map(d => ({ id: d.id, ...d.data() }))), err);
  },
  emit(name) { if (IS_PREVIEW) this.handler(name, cl(PV[name])); },
  async get(name, id) {
    if (IS_PREVIEW) { const x = PV[name].find(i => i.id === id); return x ? { ...x } : null; }
    const s = await fbm.fs.getDoc(fbm.fs.doc(db, name, id));
    return s.exists() ? { id: s.id, ...s.data() } : null;
  },
  async add(name, data, id) {
    if (IS_PREVIEW) {
      const o = { ...data, id: id || uid() }, i = PV[name].findIndex(x => x.id === o.id);
      if (i >= 0) PV[name][i] = { ...PV[name][i], ...o }; else PV[name].push(o);
      this.emit(name); return o.id;
    }
    const fs = fbm.fs;
    if (id) { await fs.setDoc(fs.doc(db, name, id), data, { merge: true }); return id; }
    return (await fs.addDoc(fs.collection(db, name), data)).id;
  },
  async update(name, id, data) {
    if (IS_PREVIEW) { const i = PV[name].findIndex(x => x.id === id); if (i >= 0) PV[name][i] = { ...PV[name][i], ...data }; this.emit(name); return; }
    await fbm.fs.updateDoc(fbm.fs.doc(db, name, id), data);
  },
  async remove(name, id) {
    if (IS_PREVIEW) { PV[name] = PV[name].filter(x => x.id !== id); this.emit(name); return; }
    await fbm.fs.deleteDoc(fbm.fs.doc(db, name, id));
  },
  async saveSettings(data) {
    if (IS_PREVIEW) { Object.assign(PV.settings, data); this.emit('settings'); return; }
    await fbm.fs.setDoc(fbm.fs.doc(db, 'settings', 'wedding'), data, { merge: true });
  }
};

/* Baca identitas tamu dari URL. Tahan terhadap hosting yang mengubah URL:
   - parameter di ?query maupun di #hash (mis. #to=Budi atau #/?to=Budi)
   - nama parameter ganda (to, kepada, nama, name, tamu, guest, untuk | id, kode, code)
   - disimpan di sessionStorage, jadi tetap ada saat reload atau saat pindah halaman admin lalu kembali */
function cleanGuestName(v) {
  let t = String(v == null ? '' : v).replace(/\+/g, ' ');
  for (let i = 0; i < 2 && /%[0-9A-Fa-f]{2}/.test(t); i++) { try { t = decodeURIComponent(t); } catch { break; } }
  return t.replace(/[\u0000-\u001f<>]/g, '').replace(/\s+/g, ' ').trim().slice(0, 80);
}
function guestParams() {
  const all = {}, pick = sp => { sp.forEach((v, k) => { k = k.toLowerCase(); if (!(k in all) && v) all[k] = v; }); };
  try { pick(new URLSearchParams(location.search)); } catch { }
  try { const h = location.hash.replace(/^#\/?/, ''), i = h.indexOf('?'), q = i >= 0 ? h.slice(i + 1) : h; if (q.includes('=')) pick(new URLSearchParams(q)); } catch { }
  if (!Object.keys(all).length) { /* tertanam di iframe (Google Sites dll): coba referrer & halaman induk, sering diblokir browser */
    try { if (document.referrer) pick(new URL(document.referrer).searchParams); } catch { }
    try { pick(new URLSearchParams(window.parent.location.search)); } catch { }
  }
  const first = (...ks) => { for (const k of ks) if (all[k]) return all[k]; return ''; };
  let id = first('id', 'kode', 'code', 'k'), to = first('to', 'kepada', 'nama', 'name', 'tamu', 'guest', 'untuk');
  try {
    if (id || to) sessionStorage.setItem('inv_guest', JSON.stringify({ id, to }));
    else { const o = JSON.parse(sessionStorage.getItem('inv_guest') || 'null'); if (o) { id = o.id || ''; to = o.to || ''; } }
  } catch { }
  return { id: String(id || '').trim().toUpperCase(), to: cleanGuestName(to) };
}
async function resolveGuest(id, to) {
  if (id === undefined || to === undefined) { const P = guestParams(); if (id === undefined) id = P.id; if (to === undefined) to = P.to; }
  G.id = null; G.name = ''; G.maks = 5; G.rsvp = null; G.opened = false;
  const nm = cleanGuestName(to);
  if (nm) G.name = nm; /* tampilkan nama dari link segera, tanpa menunggu Firestore */
  if (id) {
    try {
      const g = await Store.get('guests', String(id).trim().toUpperCase());
      if (g) { G.id = g.id; G.name = g.nama || nm || ''; G.maks = g.maksTamu || 2; G.opened = !!g.sudahBuka; try { G.rsvp = await Store.get('rsvps', g.id); } catch { } }
    } catch (e) { console.warn(e); }
  }
}

/* ===== CROPPER FOTO: sesuaikan dengan bentuk bingkai ===== */
function openCrop(src, o, done) {
  const wrap = $('#modal2'), img = new Image();
  img.onerror = () => { toast('File bukan gambar yang valid', 'err'); o.onCancel && o.onCancel(); };
  img.onload = () => {
    const iw = img.naturalWidth, ih = img.naturalHeight, free = !o.ar;
    const RATIOS = [[0, 'Asli'], [1, '1:1'], [3 / 4, '3:4'], [4 / 3, '4:3'], [16 / 9, '16:9']];
    let ar = o.ar || iw / ih, zoom = 1, ox = 0, oy = 0, fw = 0, fh = 0, base = 1;
    wrap.innerHTML = `<div class="mbk"><div class="mdl cropw"><h3 style="align-self:flex-start">${esc(o.title || 'Atur foto')}</h3>
      <p class="muted" style="margin:0;align-self:flex-start">Geser foto untuk mengatur posisi. Cubit, gulir mouse, atau pakai slider untuk zoom. Bagian di dalam bingkai itulah yang akan tampil di undangan.</p>
      ${free ? `<div class="pha" id="crr" style="align-self:flex-start">${RATIOS.map(r => `<button type="button" class="btn-s" data-r="${r[0]}">${r[1]}</button>`).join('')}</div>` : ''}
      <div class="cf" id="cf"><img id="cim" src="${esc(src)}" alt=""><div class="cgrid"></div></div>
      <input type="range" id="czm" min="1" max="4" step="0.01" value="1" style="width:100%" aria-label="Zoom">
      <div class="mact" style="width:100%"><button type="button" class="btn-s" id="cno">Batal</button><button type="button" class="btn-p" id="cok">Terapkan</button></div></div></div>`;
    const cf = $('#cf'), im = $('#cim');
    const clamp = () => { const k = base * zoom, mx = Math.max(0, (iw * k - fw) / 2), my = Math.max(0, (ih * k - fh) / 2); ox = Math.min(mx, Math.max(-mx, ox)); oy = Math.min(my, Math.max(-my, oy)); };
    const apply = () => { clamp(); const k = base * zoom; im.style.width = iw * k + 'px'; im.style.height = ih * k + 'px'; im.style.transform = `translate(calc(-50% + ${ox}px), calc(-50% + ${oy}px))`; };
    const layout = () => {
      const maxW = Math.min(320, innerWidth - 72), maxH = Math.min(380, innerHeight * .5);
      fw = maxW; fh = fw / ar; if (fh > maxH) { fh = maxH; fw = fh * ar; }
      cf.style.width = fw + 'px'; cf.style.height = fh + 'px';
      cf.style.borderRadius = o.shape === 'arch' ? `${fw / 2}px ${fw / 2}px 14px 14px` : '14px';
      base = Math.max(fw / iw, fh / ih); apply();
    };
    const setZoom = z => { zoom = Math.min(4, Math.max(1, z)); $('#czm').value = zoom; apply(); };
    layout();
    const pts = new Map(); let pd = 0;
    const dist = () => { const [a, b] = [...pts.values()]; return Math.hypot(a[0] - b[0], a[1] - b[1]); };
    cf.addEventListener('pointerdown', e => { try { cf.setPointerCapture(e.pointerId); } catch { } pts.set(e.pointerId, [e.clientX, e.clientY]); if (pts.size === 2) pd = dist(); });
    cf.addEventListener('pointermove', e => {
      if (!pts.has(e.pointerId)) return; const prev = pts.get(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]);
      if (pts.size === 2) { const d = dist(); if (pd) setZoom(zoom * d / pd); pd = d; } else { ox += e.clientX - prev[0]; oy += e.clientY - prev[1]; apply(); }
    });
    const up = e => { pts.delete(e.pointerId); pd = 0; };

/* ===== LAGU: unggah, potong, simpan (MP3 hemat, maks 75 detik) ===== */
const AUD_MAX = 75;

  const d = await Store.get('audio', 'lagu'); UPD = { stamp, data: d ? d.data : '' }; return UPD.data;

async function openAudioEditor(file) {
  let buf;

  catch (e) { console.warn(e); return toast('File audio tidak bisa dibaca. Coba format MP3, M4A, WAV, atau OGG.', 'err'); }

  const N = 700, peaks = new Float32Array(N), bs = Math.max(1, Math.floor(c0.length / N));
  for (let i = 0; i < N; i++) { let m = 0; for (let j = i * bs; j < Math.min(c0.length, (i + 1) * bs); j += 6) { const x = Math.abs((c0[j] + c1[j]) / 2); if (x > m) m = x; } peaks[i] = m; }
  const wrap = $('#modal2'), r1 = x => Math.round(x * 10) / 10;
  wrap.innerHTML = `<div class="mbk"><div class="mdl"><h3>Potong lagu</h3>
    <p class="muted" style="margin:0"><b>${esc(file.name)}</b> \u00b7 durasi ${r1(dur)} dtk. Geser penanda emas pada gelombang untuk memilih bagian yang akan diputar (maks ${AUD_MAX} detik, misalnya bagian reff).</p>
    <canvas id="wv" class="wave"></canvas>
    <div class="fgrid"><div class="fg"><label>Mulai (detik)</label><input type="number" id="ast" step="0.1" min="0"></div><div class="fg"><label>Selesai (detik)</label><input type="number" id="aen" step="0.1" min="0"></div></div>
    <p class="muted" id="ainfo" style="margin:0"></p>
    <label class="chk"><input type="checkbox" id="afd" checked> Fade in &amp; fade out 1 detik</label>
    <div class="fg"><label>Judul lagu</label><input type="text" id="aju" value="${esc(file.name.replace(/\.[^.]+$/, ''))}" maxlength="80"></div>
    <div class="mact" style="justify-content:space-between"><button type="button" class="btn-s" id="apl">${ic('play', 15)} Putar potongan</button><span style="display:flex;gap:8px"><button type="button" class="btn-s" id="ano">Batal</button><button type="button" class="btn-p" id="aok">Simpan lagu</button></span></div></div></div>`;
  const cv = $('#wv'), g = cv.getContext('2d'), I = $('#ainfo');
  const stopP = () => { try { psrc && psrc.stop(); } catch { } try { pctx && pctx.close(); } catch { } psrc = pctx = null; cancelAnimationFrame(raf); $('#apl') && ($('#apl').innerHTML = `${ic('play', 15)} Putar potongan`); draw(); };
  const draw = () => {
    const dpr = devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight; if (cv.width !== W * dpr) { cv.width = W * dpr; cv.height = H * dpr; }
    g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H); const X = t => t / dur * W;
    g.fillStyle = 'rgba(194,162,95,.28)'; g.fillRect(X(st), 0, X(en) - X(st), H);
    g.fillStyle = '#7B2230'; for (let i = 0; i < N; i++) { const h = Math.max(1, peaks[i] * (H - 10)); g.fillRect(i * W / N, (H - h) / 2, Math.max(1, W / N - .5), h); }
    g.fillStyle = '#B8935A'; [st, en].forEach(t => { g.fillRect(X(t) - 2, 0, 4, H); g.beginPath(); g.arc(X(t), H / 2, 7, 0, 6.3); g.fill(); });
    if (psrc && pctx) { const t = Math.min(en, st + (pctx.currentTime - pstart)); g.fillStyle = '#1f2430'; g.fillRect(X(t) - 1, 0, 2, H); }
  };

    if (en - st > AUD_MAX) { if (drag === 'e') en = st + AUD_MAX; else st = en - AUD_MAX; }
    $('#ast').value = r1(st); $('#aen').value = r1(en);
    I.textContent = `Potongan ${r1(en - st)} detik \u00b7 perkiraan ukuran \u2248 ${Math.round((en - st) * 8)} KB (MP3 mono 64 kbps)`; draw();
  };
  const tAt = e => { const r = cv.getBoundingClientRect(); return Math.max(0, Math.min(dur, (e.clientX - r.left) / r.width * dur)); };
  cv.onpointerdown = e => { cv.setPointerCapture(e.pointerId); const t = tAt(e); drag = Math.abs(t - st) <= Math.abs(t - en) ? 's' : 'e'; if (drag === 's') st = Math.min(t, en - 1); else en = Math.max(t, st + 1); sync(); };
  cv.onpointermove = e => { if (!drag) return; const t = tAt(e); if (drag === 's') st = Math.min(t, en - 1); else en = Math.max(t, st + 1); sync(); };
  cv.onpointerup = cv.onpointercancel = () => { drag = ''; };
  $('#ast').onchange = e => { st = Number(e.target.value) || 0; drag = 's'; sync(); drag = ''; };
  $('#aen').onchange = e => { en = Number(e.target.value) || 0; drag = 'e'; sync(); drag = ''; };
  $('#afd').onchange = e => { fade = e.target.checked; };
  $('#ano').onclick = () => { stopP(); wrap.innerHTML = ''; };
  $('#apl').onclick = () => {
    if (psrc) return stopP();
    pctx = new (window.AudioContext || window.webkitAudioContext)(); psrc = pctx.createBufferSource(); psrc.buffer = buf; const gn = pctx.createGain(), L = en - st, now = pctx.currentTime;
    gn.gain.setValueAtTime(fade ? 0 : 1, now); if (fade) { gn.gain.linearRampToValueAtTime(1, now + Math.min(1, L / 2)); gn.gain.setValueAtTime(1, now + Math.max(0, L - 1)); gn.gain.linearRampToValueAtTime(0, now + L); }
    psrc.connect(gn); gn.connect(pctx.destination); pstart = now; psrc.start(0, st, L); psrc.onended = stopP; $('#apl').innerHTML = `${ic('pause', 15)} Hentikan`;

  };

  $('#aok').onclick = async () => {
    const b = $('#aok'); b.disabled = true; b.textContent = 'Memproses\u2026';
    try {

(async function boot() {
